<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b7a4b">
  <meta name="description" content="iPAS 淨零碳規劃管理師（初級）證照 單機離線模擬考 App — 每日抽考、自動批改解析、記憶曲線錯題再現。">
  <title>iPAS 淨零碳規劃管理師 模擬考</title>

  <!-- PWA：可安裝到桌面 / 主畫面 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="淨零模擬考">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="logo"><span class="badge">iPAS</span> 淨零碳規劃管理師模擬考</div>
      <div class="spacer"></div>
      <button class="home-btn" id="home-btn">首頁</button>
    </header>
    <main id="app-main"></main>
  </div>

  <nav class="tabbar">
    <button data-tab="home"><span class="ic">🏠</span>首頁</button>
    <button data-tab="quiz"><span class="ic">📝</span>模擬考</button>
    <button data-tab="learn"><span class="ic">📖</span>學習</button>
    <button data-tab="wrong"><span class="ic">📕</span>複習</button>
    <button data-tab="settings"><span class="ic">⚙️</span>設定</button>
  </nav>

  <div class="toast" id="toast"></div>

  <!-- 資料與程式邏輯分離（§10 可維護性）；皆為本機檔案，離線可用 -->
  <script src="data/questions.js"></script>
  <script src="data/learning_content.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>

  <!-- 註冊 Service Worker（僅在 http/https 下；file:// 直接雙擊時本來就離線可用） -->
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('SW register failed', e);
        });
      });
    }
  </script>
</body>
</html>
